<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stranica ne postoji · TMBingo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
html, body { margin: 0; }
:root {
  --ink: #0b0b0b; --white: #ffffff; --mid: #8a8a8a; --line: rgba(0,0,0,.14); --green: #3faf7f;
  --body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --tech: "Chakra Petch", "Eurostile", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--white); color: var(--ink); font: 400 17px/1.6 var(--body); min-height: 100vh; }
a { color: inherit; }
a:hover { color: var(--green); }
.lbl { font: 400 14px/1.4 var(--tech); text-transform: uppercase; letter-spacing: .09em; }
.dim { color: var(--mid); }
.wrap { min-height: 100vh; display: flex; flex-direction: column; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
header { display: flex; justify-content: space-between; gap: 16px; }
header a { text-decoration: none; }
.mid { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 80px 0; }
.code { margin: 0 0 16px; }
h1 { margin: 0 0 24px; font: 500 clamp(40px, 7vw, 96px)/1 var(--body); letter-spacing: -.01em; max-width: 14ch; }
p { margin: 0 0 32px; max-width: 46ch; }
.links { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-block; padding: 14px 18px; background: var(--ink); color: var(--white); text-decoration: none; }
.btn:hover { background: var(--green); color: var(--white); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--white); }
</style>
</head>
<body>
<main class="wrap">
  <header class="lbl"><a href="/">TMBingo</a><a href="/">← Naslovna</a></header>
  <div class="mid">
    <p class="code lbl dim">404</p>
    <h1>Ova stranica ne postoji.</h1>
    <p>Možda je link star ili je adresa krivo upisana. Sve što tražiš je na naslovnoj, a klijenti se prijavljuju u TMBingo CRM.</p>
    <div class="links lbl">
      <a class="btn" href="/">Na naslovnu</a>
      <a class="btn ghost" href="/#paket">Paketi</a>
      <a class="btn ghost" href="/app/">Prijava u CRM</a>
    </div>
  </div>
  <p class="lbl dim" style="margin:0"><a href="mailto:info@tmbingo.com">info@tmbingo.com</a></p>
</main>
</body>
</html>
